name: cargo fmt
description: Run cargo fmt
runs:
  using: composite
  steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
    - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
      with:
        toolchain: nightly
        components: rustfmt
    - name: Run fmt check
      run: cargo fmt --all -- --check
      shell: bash
