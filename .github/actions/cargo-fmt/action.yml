name: cargo fmt
description: Run cargo fmt
runs:
  using: composite
  steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
    - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
      with:
        toolchain: nightly
        components: rustfmt
    - name: Run fmt check
      run: cargo fmt --all -- --check
      shell: bash
