name: cargo fmt
description: Run cargo fmt
runs:
  using: composite
  steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
    - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
      with:
        toolchain: nightly
        components: rustfmt
    - name: Run fmt check
      run: cargo fmt --all -- --check
      shell: bash
