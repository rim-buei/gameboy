name: Push pipeline

permissions: {}

on:
  push:
    branches:
      - main

env:
  RUSTFLAGS: -Dwarnings
  RUST_BACKTRACE: 1

jobs:
  fmt:
    runs-on: ubuntu-26.04
    steps:
      - uses: $/.github/actions/cargo-fmt
  clippy:
    runs-on: ubuntu-26.04
    steps:
      - uses: $/.github/actions/cargo-clippy
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-24.04
          - ubuntu-24.04-arm
          - macos-26
          - macos-26-intel
        toolchain:
          - stable
          - nightly
        profile:
          - release
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
      - name: Install Rust ${{ matrix.toolchain }}
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: ${{ matrix.toolchain }}
          components: rust-src
      - name: Build binaries in "${{ matrix.profile }}" mode
        run: cargo build --profile ${{ matrix.profile }}
        env:
          TARGET: ${{ matrix.target }}
      - name: Run tests in "${{ matrix.profile }}" mode
        run: cargo test --profile ${{ matrix.profile }}
  build-static:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: stable
          components: rust-src
      - name: Install wasm-pack
        run: |
          rustup target add wasm32-unknown-unknown
          cargo install wasm-pack
      - name: Build static site
        run: wasm-pack build --target web --out-dir static/pkg
      - name: Archive artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: static
          path: |
            static
