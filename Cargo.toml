[package]
name = "gameboy"
version = "0.3.0"
authors = ["rim-buei <rim.buei@gmail.com>"]
edition = "2024"

[lib]
crate-type = ["cdylib", "rlib"]
path = "src/lib.rs"

[[bin]]
name = "cli"
path = "src/cli.rs"

[dependencies]
wasm-bindgen = "0.2.127"
wasm-bindgen-futures = "0.4.77"
js-sys = "0.3.104"

[dependencies.web-sys]
version = "0.3.104"
features = [
  "CanvasRenderingContext2d",
  "Document",
  "Element",
  "Event",
  "EventTarget",
  "File",
  "FileList",
  "FileReader",
  "HtmlCanvasElement",
  "HtmlInputElement",
  "HtmlSelectElement",
  "ImageData",
  "KeyboardEvent",
  "ProgressEvent",
  "Response",
  "Window",
  "console",
]
